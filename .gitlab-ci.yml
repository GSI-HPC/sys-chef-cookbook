---
include:
  - project: 'chef/cookbooks/gsi_template'
    file: 'gitlab-ci/default.yml'

.kitchen:
  parallel:
    matrix:
      - SUITE:
        - accounts
        - apt
        - autofs
        - banner
        - chef
        - fail2ban
        - ferm
        - linuxlogo
        - mail
        - multipath
        - nfs
        - nftables
        - nsswitch
        - ohai
        - resolv
        - rsyslog
        - snmp
        - ssh
        - ssl
        - sudo
        - systemd
        - time
        - x509

buster:
  extends: .kitchen
  variables:
    PLATFORM: buster